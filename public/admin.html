<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المتجر</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:1100px;margin:auto;padding:30px 5%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:#291b3e;border:1px solid #ffffff22;color:white;padding:10px;border-radius:9px}.panel{background:#1d1230;padding:22px;border-radius:16px;margin:15px 0}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid input,.formgrid select,.formgrid textarea{width:100%}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{text-align:right;padding:10px;border-bottom:1px solid #ffffff20}#app{display:none}@media(max-width:600px){.formgrid{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><div class="admin"><a class="brand" href="/">✦ المتجر</a><section id="login" class="panel"><h2>دخول الإدارة</h2><div id="setupHint">لإنشاء المدير الأول افتحي <a href="/setup.html">صفحة الإعداد الأولي</a>.</div><form id="loginForm" class="formgrid"><input name="username" placeholder="اسم المستخدم" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="btn">دخول</button></form><p id="loginMsg"></p></section><div id="app"><h1>لوحة التحكم</h1><div class="tabs"><button data-tab="dashboard">الرئيسية والتقارير</button><button data-tab="products">المنتجات</button><button data-tab="orders">الطلبات</button><button data-tab="returns">المرتجعات</button><button data-tab="losses">الخسائر والتالف</button><button data-tab="expenses">المصروفات</button><button data-tab="settings">إعدادات المتجر</button></div><div id="view"></div></div></div><script src="/admin.js"></script></body></html>
