<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>الإعداد الأولي للمتجر</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="admin" style="max-width:560px;margin:50px auto">
    <section class="panel">
      <h1>إنشاء حساب المدير الأول</h1>
      <p class="muted">تُستخدم هذه الصفحة مرة واحدة فقط. بعد إنشاء الحساب سيُغلق الإعداد الأولي تلقائيًا من الخادم.</p>
      <form id="setupForm" class="formgrid">
        <label style="grid-column:1/-1">مفتاح الإعداد الأولي<input name="setup_key" type="password" autocomplete="off" required></label>
        <label style="grid-column:1/-1">اسم المستخدم<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" autocomplete="username" required></label>
        <label style="grid-column:1/-1">كلمة المرور<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
        <button class="btn" type="submit">إنشاء حساب المدير</button>
      </form>
      <p id="setupResult" role="status" aria-live="polite"></p>
      <a href="/admin.html">العودة إلى تسجيل الدخول</a>
    </section>
  </main>
  <script src="/setup.js" defer></script>
</body>
</html>
